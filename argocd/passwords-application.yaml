apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: passwords
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yashbhangale/My-HomeLab
    targetRevision: main
    path: passwords
  destination:
    server: https://kubernetes.default.svc
    namespace: passwords
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
