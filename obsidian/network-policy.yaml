apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: obsidian-ingress
  namespace: obsidian
spec:
  podSelector:
    matchLabels: {app: obsidian}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: obsidian-tunnel}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports:
        - {protocol: TCP, port: 8080}
