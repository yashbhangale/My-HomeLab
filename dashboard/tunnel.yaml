apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-tunnel
  namespace: dashboard
data:
  config.yaml: "tunnel: 35b73a59-3705-4b1a-ba10-b948d7830246\ncredentials-file: /etc/cloudflared/credentials/credentials.json\n\
    ingress:\n  - hostname: dashboard.yashbhangale.site\n    service: http://homepage.dashboard.svc.cluster.local:80\n\
    \  - hostname: status.yashbhangale.site\n    service: http://homepage.dashboard.svc.cluster.local:80\n\
    \  - service: http_status:404\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-tunnel
  namespace: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-tunnel
  template:
    metadata:
      labels:
        app: dashboard-tunnel
    spec:
      automountServiceAccountToken: false
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared:2026.10.7
        args:
        - tunnel
        - --no-autoupdate
        - --config
        - /etc/cloudflared/config/config.yaml
        - --metrics
        - 0.0.0.0:9090
        - run
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
            ephemeral-storage: 128Mi
        readinessProbe:
          httpGet:
            path: /ready
            port: 9090
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        - name: credentials
          mountPath: /etc/cloudflared/credentials
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: dashboard-tunnel
      - name: credentials
        secret:
          secretName: dashboard-tunnel-credentials
