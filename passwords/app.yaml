apiVersion: v1
kind: Namespace
metadata:
  name: passwords
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: passwords
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: vaultwarden}
  template:
    metadata:
      labels: {app: vaultwarden}
    spec:
      nodeSelector: {kubernetes.io/hostname: boii}
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.5-alpine
          env:
            - {name: DOMAIN, value: "https://passwords.yashbhangale.site"}
            - {name: ROCKET_ADDRESS, value: "0.0.0.0"}
            - {name: ROCKET_PORT, value: "8080"}
            - {name: SIGNUPS_ALLOWED, value: "false"}
            - {name: INVITATIONS_ALLOWED, value: "false"}
            - {name: SHOW_PASSWORD_HINT, value: "false"}
            - {name: SENDS_ALLOWED, value: "false"}
            - {name: ICON_SERVICE, value: "internal"}
            - {name: TZ, value: Asia/Kolkata}
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: vaultwarden-admin, key: ADMIN_TOKEN}
          ports: [{name: vault, containerPort: 8080}]
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 64Mi, ephemeral-storage: 64Mi}
            limits: {cpu: 500m, memory: 256Mi, ephemeral-storage: 256Mi}
          startupProbe:
            httpGet: {path: /alive, port: vault}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /alive, port: vault}
          volumeMounts:
            - {name: data, mountPath: /data}
        - name: gateway
          image: nginx:1.28-alpine
          ports: [{name: http, containerPort: 8081}]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi, ephemeral-storage: 64Mi}
          readinessProbe:
            tcpSocket: {port: http}
          volumeMounts:
            - {name: gateway, mountPath: /etc/nginx/conf.d, readOnly: true}
      volumes:
        - name: data
          hostPath:
            path: /home/yash/.local/share/passwords/data
            type: Directory
        - name: gateway
          configMap: {name: passwords-gateway}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: passwords-gateway
  namespace: passwords
data:
  default.conf: |
    map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
    }
    server {
      listen 8081;
      server_name passwords.yashbhangale.site;
      server_tokens off;
      client_max_body_size 100m;
      location ~* ^/admin(?:/|$) { return 404; }
      location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: passwords
spec:
  selector: {app: vaultwarden}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  namespace: passwords
spec:
  ingressClassName: traefik
  rules:
    - host: passwords.yashbhangale.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port: {number: 80}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vaultwarden-ingress
  namespace: passwords
spec:
  podSelector:
    matchLabels: {app: vaultwarden}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: passwords-tunnel}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: dashboard}
          podSelector:
            matchLabels: {app: homepage}
      ports: [{protocol: TCP, port: 8081}]
